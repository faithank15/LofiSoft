body{margin:0}
@property --k { syntax: '<integer>'; inherits: false; initial-value: 426; }
@keyframes kup { from { --k: 0; } to { --k: 426; } }
@keyframes fillw { from { width: 0; } to { width: 65.7%; } }

.sun { animation: sunx 2.2s cubic-bezier(0.16, 1, 0.3, 1) both; }

@keyframes sunrise { from { transform: translateY(120px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
@keyframes cityup { from { transform: translateY(70px) } to { transform: translateY(0) } }
@keyframes draw { from { stroke-dashoffset: 60 } to { stroke-dashoffset: 0 } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0 } 60% { transform: scale(1.06); opacity: 1 } 100% { transform: scale(1) } }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
@keyframes sweep { from { transform: translateX(-100%) } to { transform: translateX(260%) } }
@keyframes halo { from { transform: scale(0.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.sp-sun { animation: sunrise 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both }
.sp-halo { animation: halo 2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both }
.sp-city { animation: cityup 1.4s cubic-bezier(0.16, 1, 0.3, 1) both }
.sp-logo { animation: pop 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) 0.5s both }
.sp-roof { stroke-dasharray: 60; animation: draw 0.7s ease-out 0.9s both }
.sp-l { stroke-dasharray: 60; animation: draw 0.6s ease-out 1.3s both }
.sp-word { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both }
.sp-tag { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.6s both }
.sp-bar { animation: sweep 1.5s ease-in-out 1.8s infinite }
</style>
